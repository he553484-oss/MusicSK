# Builds and publishes one Apple release: the unsigned iOS IPA, the ad-hoc
# signed Mac DMG and the release manifest, then signs the Sparkle appcast and
# commits it to main.
#
# Start it by pushing a tag (git tag v1.0.6 && git push origin v1.0.6) or from
# the Actions tab. Before either, AppleApp/project.yml must carry the version
# and a new build number, and release-notes/musicsk/<version>.md must exist on that
# commit.
#
# Public updates require the SPARKLE_ED_PRIVATE_KEY secret and matching
# MUSICSK_SPARKLE_PUBLIC_KEY repository variable.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.6 (must match AppleApp/project.yml)'
        required: true
      mode:
        description: 'build-ios = unsigned IPA only; capture-ios = simulator screenshots; build = IPA and DMG; draft = draft release; publish = public release + appcast'
        type: choice
        options: [build-ios, capture-ios, build, draft, publish]
        default: build

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'capture-ios' && 'capture-ios' || 'release' }}
  cancel-in-progress: false

jobs:
  # A tag pushed for a release that already exists (for example one published
  # by hand, or created with gh release create) has nothing left to do.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == push ]] && gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    # Xcode 27 (public preview image); the app links the macOS/iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
      GH_TOKEN: ${{ github.token }}
      MUSICSK_RELEASE_REPOSITORY: ${{ github.repository }}
      MUSICSK_SPARKLE_FEED: https://raw.githubusercontent.com/${{ github.repository }}/main/musicsk-appcast.xml
      MUSICSK_SPARKLE_PUBLIC_KEY: ${{ vars.MUSICSK_SPARKLE_PUBLIC_KEY }}
    steps:
      - name: Normalise the version
        run: |
          v="${VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.0.6, got '$VERSION'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the release inputs
        env:
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          [[ -f "release-notes/musicsk/$VERSION.md" ]] || { echo "::error::release-notes/musicsk/$VERSION.md is missing"; exit 1; }
          if [[ "$MODE" == draft || "$MODE" == publish ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG already exists"; exit 1
          fi
          if [[ "$MODE" == publish && ( "$HAS_SPARKLE_KEY" != true || -z "$MUSICSK_SPARKLE_PUBLIC_KEY" ) ]]; then
            echo "::error::The Sparkle private secret and Musicsk public key variable are required"; exit 1
          fi

      - name: Select Xcode 27
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          [[ -n "$xcode" ]] || { echo "::error::This runner image has no Xcode 27"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Rust targets and tools
        run: |
          rustup target add aarch64-apple-darwin aarch64-apple-ios
          brew install xcodegen
          case "$MODE" in
            capture-ios) rustup target add aarch64-apple-ios-sim ;;
            build-ios) ;;
            *) brew install create-dmg ;;
          esac

      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.cargo/registry
            ~/.cargo/git
            native-core/target
          key: build-${{ runner.os }}-${{ hashFiles('native-core/Cargo.lock', '*.gradle.kts', 'shared/*.gradle.kts','gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: build-${{ runner.os }}-

      - name: Verify presentation, playback and package contracts
        if: env.MODE == 'build-ios'
        run: |
          failed=0
          run_check() {
            local name="$1"
            shift
            printf '::group::%s\n' "$name"
            if "$@"; then
              printf 'PASS %s\n' "$name"
            else
              printf 'FAIL %s\n' "$name"
              failed=1
            fi
            printf '::endgroup::\n'
          }
          run_check player-layout bash scripts/check-player-layout.sh
          run_check detail-header bash scripts/check-detail-header.sh
          run_check video-gating bash scripts/check-video-gating.sh
          run_check video-sync bash scripts/check-video-sync.sh
          run_check lyrics-presentation bash scripts/check-lyrics-presentation.sh
          run_check lyrics-source bash scripts/check-lyrics.sh --source-only
          run_check system-volume bash scripts/check-system-volume.sh
          run_check now-playing bash scripts/check-now-playing.sh
          run_check lossless-route bash scripts/check-lossless-route.sh
          run_check quality-log bash scripts/check-quality-log.sh
          run_check source-label bash scripts/check-source-label.sh
          run_check queue bash scripts/check-queue.sh
          run_check session-restore bash scripts/check-session-restore.sh
          run_check stream-recovery bash scripts/check-stream-recovery.sh
          run_check transport bash scripts/check-transport.sh
          run_check local-library bash scripts/check-local-library.sh
          run_check listening bash scripts/check-listening.sh
          run_check jiosaavn-response bash scripts/check-jiosaavn-response.sh
          run_check jiosaavn-stream bash scripts/check-jiosaavn-stream.sh
          run_check cached-bitrate bash scripts/check-cached-bitrate.sh
          run_check lossless-note bash scripts/check-lossless-note.sh
          run_check settings-audio bash scripts/check-settings-audio.sh
          run_check appearance-profile bash scripts/check-appearance-profile.sh
          run_check pages bash scripts/check-pages.sh
          run_check settings-parity bash scripts/check-settings-parity.sh
          run_check menus bash scripts/check-menus.sh
          run_check ipa-verifier python3 scripts/release-verify/check-ios-ipa.py
          exit "$failed"

      - name: Build the unsigned iOS IPA
        if: env.MODE == 'build-ios'
        run: |
          NATIVE_TARGETS="aarch64-apple-darwin aarch64-apple-ios" scripts/build-native-core.sh
          cargo test --manifest-path native-core/Cargo.toml --release --target aarch64-apple-darwin --lib eq_commands_change_the_real_mixer_output_and_transparent_bypasses_it
          CONFIG=release scripts/build-shared-framework.sh
          xcodegen generate --spec AppleApp/project.yml
          scripts/package-ios-ipa.sh "$VERSION" --output-dir build/release
          (
            cd build/release
            ipas=(Musicsk-"$VERSION"-build*-ios-unsigned.ipa)
            [[ ${#ipas[@]} -eq 1 && -f "${ipas[0]}" ]]
            shasum -a 256 "${ipas[0]}" | tee SHA256.txt
            shasum -a 256 -c SHA256.txt
          )

      - name: Test shared JioSaavn response handling on macOS
        if: env.MODE == 'build-ios'
        timeout-minutes: 10
        run: ./gradlew :shared:macosArm64Test --tests '*JioSaavnTransportTest*'

      - name: Exercise the native audio engine on macOS
        if: env.MODE == 'build-ios'
        timeout-minutes: 6
        run: |
          set -o pipefail
          failed=0
          {
            if bash scripts/check-engine.sh; then
              printf '%s\n' 'PASS native output, mixer and playback contracts'
            else
              printf '%s\n' 'FAIL native output, mixer or playback contracts'
              failed=1
            fi
            if bash scripts/check-audio-quality.sh; then
              printf '%s\n' 'PASS 24-bit/96 kHz WAV and ALAC decoding'
            else
              printf '%s\n' 'FAIL 24-bit/96 kHz WAV or ALAC decoding'
              failed=1
            fi
            exit "$failed"
          } 2>&1 | tee build/release/native-audio-macos.txt

      - name: Capture Musicsk on an iOS simulator
        if: env.MODE == 'capture-ios'
        run: |
          NATIVE_TARGETS="aarch64-apple-darwin aarch64-apple-ios-sim" scripts/build-native-core.sh
          CONFIG=release scripts/build-shared-framework.sh
          xcodegen generate --spec AppleApp/project.yml
          bash scripts/capture-ios-simulator.sh build/simulator-captures

      - name: Compare decoded video startup on the Mac runner
        if: env.MODE == 'capture-ios'
        timeout-minutes: 5
        continue-on-error: true
        env:
          VIDEO_STARTUP_BASELINE_REF: 0ef9b680868a02461f4e26a1223b666649f516b6
        run: |
          log=build/simulator-captures/video-startup-macos.txt
          {
            printf 'First decoded frame on macOS using the local H.264 fixture\n'
            printf 'Baseline %s\nCandidate %s\n' "$VIDEO_STARTUP_BASELINE_REF" "$GITHUB_SHA"
            if ! command -v ffmpeg >/dev/null; then
              printf 'BLOCKED: ffmpeg is unavailable on this runner\n'
            elif bash scripts/check-video-startup.sh; then
              printf 'PASS: benchmark completed\n'
            else
              printf 'FAIL: benchmark did not complete\n'
            fi
          } 2>&1 | tee "$log"

      - name: Keep the simulator capture files
        if: ${{ always() && env.MODE == 'capture-ios' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicsk-${{ env.VERSION }}-simulator
          path: build/simulator-captures/
          retention-days: 14
          if-no-files-found: warn

      - name: Build the paired release files
        if: env.MODE != 'build-ios' && env.MODE != 'capture-ios'
        run: scripts/release-apple.sh "$VERSION" --output-dir build/release

      - name: Keep the files as a workflow artifact
        if: ${{ (success() || (failure() && env.MODE == 'build-ios')) && env.MODE != 'capture-ios' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicsk-${{ env.VERSION }}
          path: build/release/
          retention-days: 14
          if-no-files-found: error

      - name: Create the GitHub release
        if: env.MODE == 'draft' || env.MODE == 'publish'
        run: |
          cd build/release
          flags=()
          [[ "$MODE" == draft ]] && flags+=(--draft)
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Musicsk $VERSION" \
            --notes-file "$GITHUB_WORKSPACE/release-notes/musicsk/$VERSION.md" \
            "${flags[@]}" \
            Musicsk-$VERSION-build*-ios-unsigned.ipa \
            Musicsk-$VERSION-build*-mac-arm64.dmg \
            release.json SHA256.txt INSTALL.md

      - name: Sign the appcast and commit it to main
        if: env.MODE == 'publish'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          spm="$RUNNER_TEMP/spm"
          xcodebuild -resolvePackageDependencies -project AppleApp/Musicsk.xcodeproj -clonedSourcePackagesDirPath "$spm" >/dev/null
          export SPARKLE_GENERATE_APPCAST="$(find "$spm" -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' -type f -print -quit)"
          key="$RUNNER_TEMP/sparkle-ed-key"
          ( umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key" )
          export SPARKLE_ED_KEY_FILE="$key"
          git fetch origin main
          git checkout -B main origin/main
          scripts/generate-mac-appcast.sh "$TAG" build/release/Musicsk-$VERSION-build*-mac-arm64.dmg "release-notes/musicsk/$VERSION.md"
          rm -f "$key"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add musicsk-appcast.xml
          git commit -m "release: appcast for $VERSION"
          git push origin main
